# Render "Blueprint": New > Blueprint in the Render dashboard, then pick this repo.
services:
  - type: web
    name: qalam
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SITE_NAME
        value: Qalam
      - key: CONTACT_EMAIL
        sync: false        # Render asks you for this value when you create the service
